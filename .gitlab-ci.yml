stages:
  - deploy

variables:
  APP_PATH: '$CI_PROJECT_DIR/build'
  CONFIG_PATH: '$CI_PROJECT_DIR/build'
  SKIP_APP_BUILD: 'true'
  VERBOSE: 'true'

deploy-development:
  stage: deploy
  environment: development
  variables:
    API_TOKEN: $DEPLOYMENT_TOKEN_DEV
    DEPLOYMENT_ENVIRONMENT: "Development"
    BRANCH: "development"
    SKIP_APP_BUILD: "true"
    APP_PATH: '$CI_PROJECT_DIR/build'
    CONFIG_PATH: '$CI_PROJECT_DIR/build'
  image: registry.gitlab.com/static-web-apps/azure-static-web-apps-deploy
  script:
    - echo "Deploying Development application..."
    - bash /entrypoint.sh
    - echo "Development Application successfully deployed."
  only:
    - development

deploy-production:
  stage: deploy
  environment: production
  variables:
    API_TOKEN: $DEPLOYMENT_TOKEN
    BRANCH: "master"
    PROD_BRANCH: "master"
    SKIP_APP_BUILD: "true"
    VERBOSE: "true"
    APP_PATH: '$CI_PROJECT_DIR/build'
    CONFIG_PATH: '$CI_PROJECT_DIR/build'
  image: registry.gitlab.com/static-web-apps/azure-static-web-apps-deploy
  script:
    - echo "Deploying Production application from pre-built build/ directory to Azure Static Web Apps..."
    - ls -la $APP_PATH
    - bash /entrypoint.sh
    - echo "Production Application successfully deployed."
  only:
    - master
