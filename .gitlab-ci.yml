stages:
  - build
  - deploy

variables:
  APP_PATH: '$CI_PROJECT_DIR'
  OUTPUT_PATH: '$CI_PROJECT_DIR/build'
  ARTIFACT_PATH: '$CI_PROJECT_DIR/build'
  CONFIG_PATH: '$CI_PROJECT_DIR/build'
  SKIP_APP_BUILD: 'true'
  VERBOSE: 'true'

build-production:
  stage: build
  image: node:20-alpine
  script:
    - echo "Building application and generating pre-rendered static routes..."
    - npm install --legacy-peer-deps
    - DISABLE_ESLINT_PLUGIN=true CI=false npm run build
    - cp staticwebapp.config.json build/staticwebapp.config.json || true
    - cp build/index.html ./index.html || true
  artifacts:
    paths:
      - build/
      - index.html
    expire_in: 1 hour
  only:
    - master

deploy-development:
  stage: deploy
  environment: development
  variables:
    API_TOKEN: $DEPLOYMENT_TOKEN_DEV
    DEPLOYMENT_ENVIRONMENT: "Development"
    SKIP_APP_BUILD: "true"
    APP_PATH: '$CI_PROJECT_DIR'
    OUTPUT_PATH: '$CI_PROJECT_DIR/build'
    ARTIFACT_PATH: '$CI_PROJECT_DIR/build'
    CONFIG_PATH: '$CI_PROJECT_DIR/build'
  image: registry.gitlab.com/static-web-apps/azure-static-web-apps-deploy
  script:
    - echo "Deploying Development application..."
    - cp -r build/* ./ || true
    - bash /entrypoint.sh
    - echo "Development Application successfully deployed."
  only:
    - development

deploy-production:
  stage: deploy
  environment: production
  variables:
    API_TOKEN: $DEPLOYMENT_TOKEN
    DEPLOYMENT_ENVIRONMENT: "Production"
    SKIP_APP_BUILD: "true"
    VERBOSE: "true"
    APP_PATH: '$CI_PROJECT_DIR'
    OUTPUT_PATH: '$CI_PROJECT_DIR/build'
    ARTIFACT_PATH: '$CI_PROJECT_DIR/build'
    CONFIG_PATH: '$CI_PROJECT_DIR/build'
  image: registry.gitlab.com/static-web-apps/azure-static-web-apps-deploy
  script:
    - echo "Deploying Production application to Azure Static Web Apps..."
    - cp -r build/* ./ || true
    - bash /entrypoint.sh
    - echo "Production Application successfully deployed."
  only:
    - master



