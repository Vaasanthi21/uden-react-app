<!DOCTYPE html>
<html>
<head>


  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UDEN">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="uden">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png"/>

  <title>uden</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<!-- This script installs service_worker.js to provide PWA functionality to
     application. For more information, see:
     https://developers.google.com/web/fundamentals/primers/service-workers -->
<style>
     .center{
      height: 100vh;
        width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      align-items: center;
        align-content: center;
        justify-content: center;
        justify-items: center;
     }
      .logo{
        height: 200px;
        width: 200px;

      }
      .column{
        display: flex;
        flex-direction: column;
      }
      .ring{
        align-self: center;
        box-sizing: border-box;
        display: block;
        width: 64px;
        height: 64px;
        border: 8px solid orange;
        border-radius: 50%;
        animation: ring 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
        border-color: orange transparent transparent transparent;
      }
      .ring div:nth-child(1){
        animation-delay: -0.45s;
      }
      .ring div:nth-child(2){
        animation-delay: -0.3s;
      }
      .ring div:nth-child(3){
        animation-delay: -0.15s;
      }

      @keyframes ring {
        0%{
          transform: rotate(0deg);
        }
        100%{
          transform: rotate(360deg);
        }

      }

     </style>
<div class="center">
  <div class="column">
    <img class="logo" src="logo.png" alt="loading_logo">
    <div class="ring">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

</div>


<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=2550583302');
      });
    }
  </script>




<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.7.570/build/pdf.js" type="text/javascript"></script>
<script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.7.570/build/pdf.worker.min.js";
    pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.7.570/cmaps/',
      cMapPacked: true,
    }
  </script>
<script src="main.dart.js" type="application/javascript"></script>

</body>
</html>
